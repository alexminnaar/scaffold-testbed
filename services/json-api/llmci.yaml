version: 1

target:
  command: "python3 api/run_api.py --input {input_file} --output {output_file}"

evals:
  - name: api-json-validation
    level: prompt
    dataset: ./evals/api_responses.jsonl
    # Validate the contact JSON the endpoint returns. name + email are always
    # required; phone is optional because not every message includes one.
    judge:
      type: structured
      json_schema:
        type: object
        required: [name, email]
        properties:
          name:  {type: string, minLength: 1}
          email: {type: string, pattern: "@"}
          phone: {type: string}
    metrics:
      - name: accuracy
        threshold: 1.0
        mode: absolute

settings:
  parallelism: 5
  timeout_per_call: 20
  retries: 1
